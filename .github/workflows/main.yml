                  bottomBar.addView(btn("حذف از لیست", Ui.FIELD, Ui.TEXT, Ui.CARD_STROKE) { hideSelected() }, bp())
                  bottomBar.addView(btn("حذف از گوشی", Ui.DANGER, Color.WHITE, 0) { confirmDelete() }, bp())
                  bottomBar.addView(btn("لغو", Color.TRANSPARENT, Ui.MUTED, Ui.CARD_STROKE) {
