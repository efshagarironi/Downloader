name: Build ShareDL APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android project
        run: |
          mkdir -p app/src/main/java/com/sharedl/app
          mkdir -p app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26 app/src/main/res/mipmap-anydpi app/src/main/res/anim
          echo '' | base64 -d > app/shared.p12

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'ShareDL'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          def appVersionCode = Integer.parseInt((project.findProperty('vCode') ?: '1').toString())

          android {
              namespace 'com.sharedl.app'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.sharedl.app'
                  minSdk 24
                  targetSdk 34
                  versionCode = appVersionCode
                  versionName = '1.0'
                  ndk {
                      abiFilters 'arm64-v8a', 'armeabi-v7a'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }

              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }

              signingConfigs {
                  shared {
                      storeFile file('shared.p12')
                      storePassword 'sharedl123'
                      keyAlias 'sharedl'
                      keyPassword 'sharedl123'
                      storeType 'pkcs12'
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.shared
                  }
                  release {
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
              implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
              implementation 'io.github.junkfood02.youtubedl-android:aria2c:0.18.1'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission
                  android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />
              <uses-permission
                  android:name="android.permission.READ_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />

              <queries>
                  <package android:name="app.revanced.android.apps.youtube.music" />
                  <package android:name="app.revanced.android.youtube" />
                  <package android:name="com.aparat" />
                  <package android:name="com.aparat.android" />
                  <package android:name="com.bilibili.app.in" />
                  <package android:name="com.dailymotion.dailymotion" />
                  <package android:name="com.facebook.katana" />
                  <package android:name="com.facebook.lite" />
                  <package android:name="com.google.android.apps.youtube.music" />
                  <package android:name="com.google.android.youtube" />
                  <package android:name="com.instagram.android" />
                  <package android:name="com.instagram.barcelona" />
                  <package android:name="com.instagram.lite" />
                  <package android:name="com.kwai.video" />
                  <package android:name="com.linkedin.android" />
                  <package android:name="com.pinterest" />
                  <package android:name="com.reddit.frontpage" />
                  <package android:name="com.rumble.battles" />
                  <package android:name="com.snapchat.android" />
                  <package android:name="com.soundcloud.android" />
                  <package android:name="com.ss.android.ugc.trill" />
                  <package android:name="com.twitter.android" />
                  <package android:name="com.twitter.android.lite" />
                  <package android:name="com.vanced.android.youtube" />
                  <package android:name="com.vimeo.android.videoapp" />
                  <package android:name="com.zhiliaoapp.musically" />
                  <package android:name="ir.aparat.android" />
                  <package android:name="org.telegram.messenger" />
                  <package android:name="org.telegram.messenger.web" />
                  <package android:name="org.telegram.plus" />
                  <package android:name="org.thunderdog.challegram" />
                  <package android:name="tv.danmaku.bili" />
                  <package android:name="tv.twitch.android.app" />
                  <package android:name="video.like" />
              </queries>


              <application
                  android:label="Downloader"
                  android:icon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:largeHeap="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".DownloadsActivity"
                      android:exported="false" />

                  <activity
                      android:name=".QualitySettingsActivity"
                      android:exported="false" />

                  <activity
                      android:name=".InstaLoginActivity"
                      android:exported="false" />

                  <activity
                      android:name=".YoutubeLoginActivity"
                      android:exported="false" />

                  <activity
                      android:name=".MenuActivity"
                      android:exported="false" />

                  <activity
                      android:name=".BarSettingsActivity"
                      android:exported="false" />

                  <activity
                      android:name=".BottomBarSettingsActivity"
                      android:exported="false" />

                  <activity
                      android:name=".ProgressBarSettingsActivity"
                      android:exported="false" />

                  <activity
                      android:name=".PlayerActivity"
                      android:exported="false"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden|uiMode"
                      android:theme="@android:style/Theme.Material.NoActionBar.Fullscreen" />

                  <service
                      android:name=".DownloadService"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/sharedl/app/Core.kt <<'EOF'
          package com.sharedl.app

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.media.MediaMetadataRetriever
          import android.net.Uri
          import java.net.HttpURLConnection
          import java.net.URL
          import android.content.ContentValues
          import android.content.Context
          import android.content.Intent
          import android.media.MediaScannerConnection
          import android.os.Build
          import android.os.Environment
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.provider.MediaStore
          import android.webkit.MimeTypeMap
          import androidx.core.app.NotificationCompat
          import com.yausername.aria2c.Aria2c
          import com.yausername.ffmpeg.FFmpeg
          import com.yausername.youtubedl_android.YoutubeDL
          import com.yausername.youtubedl_android.YoutubeDLRequest
          import java.io.File
          import java.util.concurrent.Executors
          import java.util.concurrent.atomic.AtomicInteger

          object Bus {
              private val log = StringBuilder()
              private val handler = Handler(Looper.getMainLooper())
              var onChange: (() -> Unit)? = null

              fun post(msg: String) {
                  synchronized(log) {
                      log.append(msg).append("\n\n")
                      if (log.length > 20000) log.delete(0, log.length - 15000)
                  }
                  handler.post { onChange?.invoke() }
              }

              fun snapshot(): String = synchronized(log) { log.toString() }
          }

          object Engine {
              private var ready = false
              @Volatile var aria2Ready = false

              @Synchronized
              fun ensureInit(ctx: Context) {
                  if (ready) return
                  val app = ctx.applicationContext
                  YoutubeDL.getInstance().init(app)
                  FFmpeg.getInstance().init(app)
                  try {
                      Aria2c.getInstance().init(app)
                      aria2Ready = true
                  } catch (e: Throwable) {
                      aria2Ready = false
                  }
                  ready = true
              }

              fun lastUpdate(ctx: Context): Long =
                  ctx.applicationContext.getSharedPreferences("prefs", Context.MODE_PRIVATE).getLong("lastUpdate", 0L)

              // Updates yt-dlp to the NIGHTLY channel (fixes YouTube/Threads/etc. fastest).
              // Falls back to the stable channel if nightly is not available.
              @Synchronized
              fun update(ctx: Context): String {
                  ensureInit(ctx)
                  val app = ctx.applicationContext
                  val yd = YoutubeDL.getInstance()
                  var result: String? = null
                  var nightlyFailure: Throwable? = null
                  try {
                      val cls = Class.forName("com.yausername.youtubedl_android.YoutubeDL\$UpdateChannel")
                      var ch: Any? = null
                      for (n in listOf("_NIGHTLY", "NIGHTLY")) {
                          try {
                              ch = cls.getField(n).get(null)
                          } catch (e: Throwable) {
                          }
                          if (ch != null) break
                      }
                      if (ch == null) {
                          try {
                              ch = Class.forName("com.yausername.youtubedl_android.YoutubeDL\$UpdateChannel\$NIGHTLY")
                                  .getField("INSTANCE").get(null)
                          } catch (e: Throwable) {
                          }
                      }
                      if (ch != null) {
                          val m = yd.javaClass.getMethod("updateYoutubeDL", Context::class.java, cls)
                          result = m.invoke(yd, app, ch)?.toString() ?: "nightly"
                      }
                  } catch (e: Throwable) {
                      nightlyFailure = e
                  }
                  if (result == null) {
                      result = yd.updateYoutubeDL(app)?.toString() ?: "stable"
                  }
                  app.getSharedPreferences("prefs", Context.MODE_PRIVATE).edit()
                      .putLong("lastUpdate", System.currentTimeMillis()).apply()
                  return result
              }
          }

          fun fmtBytes(b: Long): String {
              val v = b.toDouble()
              return when {
                  v >= 1073741824.0 -> String.format(java.util.Locale.US, "%.2f GB", v / 1073741824.0)
                  v >= 1048576.0 -> String.format(java.util.Locale.US, "%.1f MB", v / 1048576.0)
                  else -> String.format(java.util.Locale.US, "%d KB", (v / 1024.0).toLong())
              }
          }

          class DlItem(val id: Long, val url: String, val mode: String) {
              @Volatile var title: String = url.removePrefix("https://").removePrefix("http://").removePrefix("www.").take(60)
              @Volatile var state = 0 // 0 = queued, 1 = downloading, 2 = saving
              @Volatile var pct = -1
              @Volatile var done = 0L
              @Volatile var total = 0L
              @Volatile var speed = ""
              @Volatile var eta = ""
              @Volatile var cancelled = false
              @Volatile var processId: String? = null
          }

          object DlQueue {
              private val list = ArrayList<DlItem>()
              private val handler = Handler(Looper.getMainLooper())
              private val seq = java.util.concurrent.atomic.AtomicLong(0)
              var onChange: (() -> Unit)? = null

              fun add(url: String, mode: String): DlItem {
                  val item = DlItem(seq.incrementAndGet(), url, mode)
                  synchronized(list) { list.add(item) }
                  changed()
                  return item
              }

              fun remove(item: DlItem) {
                  synchronized(list) { list.remove(item) }
                  changed()
              }

              fun snapshot(): List<DlItem> = synchronized(list) { ArrayList(list) }

              // Cancels a queued or running download; the next queued item starts automatically.
              fun cancel(id: Long) {
                  val item = synchronized(list) { list.firstOrNull { it.id == id } } ?: return
                  item.cancelled = true
                  val pid = item.processId
                  if (pid != null) {
                      Thread {
                          try {
                              YoutubeDL.getInstance().destroyProcessById(pid)
                          } catch (e: Throwable) {
                          }
                      }.start()
                  }
                  remove(item)
              }

              fun changed() {
                  handler.post { onChange?.invoke() }
              }
          }

          class DownloadService : Service() {

              private val exec = Executors.newSingleThreadExecutor()
              private val pending = AtomicInteger(0)
              private val nid = AtomicInteger(100)

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  ensureChannel()
                  startForeground(1, buildNotif("در صف دانلود…", -1, true))
                  val url = intent?.getStringExtra("url")
                  val mode = intent?.getStringExtra("mode") ?: "720"
                  if (url == null) {
                      if (pending.get() == 0) {
                          stopForeground(true)
                          stopSelf()
                      }
                      return START_NOT_STICKY
                  }
                  val item = DlQueue.add(url, mode)
                  pending.incrementAndGet()
                  exec.execute {
                      try {
                          if (!item.cancelled) download(url, mode, item)
                      } catch (t: Throwable) {
                          if (item.cancelled) return@execute
                          val full = (t.message ?: t.toString()).trim()
                          val m = full.take(400)
                          val hint = if (m.contains("Instagram", true)) "\nℹ️ اگر مشکل ادامه داشت، از صفحه اصلی «ورود به اینستاگرام» را (دوباره) انجام بده." else ""
                          Bus.post("❌ خطا: $m" + hint)
                          notify(2, buildNotif("❌ دانلود ناموفق بود: " + full.lines().last().take(100), -1, false))
                      } finally {
                          DlQueue.remove(item)
                          if (pending.decrementAndGet() == 0) {
                              stopForeground(true)
                              stopSelf()
                          }
                      }
                  }
                  return START_NOT_STICKY
              }

              private fun buildRequest(url: String, mode: String, dir: File, client: String?, level: Int = 0): YoutubeDLRequest {
                  val req = YoutubeDLRequest(url)
                  req.addOption("--no-playlist")
                  req.addOption("--no-mtime")
                  req.addOption("--retries", "5")
                  req.addOption("--fragment-retries", "5")
                  req.addOption("-N", "8")
                  req.addOption("--socket-timeout", "20")
                  req.addOption("--throttled-rate", "100K")
                  // aria2 (multi-connection) for ordinary sites; not for YouTube/Instagram/Threads, where many connections trigger blocks.
                  // Only on the first attempt: later fallback attempts use the built-in downloader.
                  if (level == 0 && Engine.aria2Ready &&
                      !Regex("(youtube\\.com|youtu\\.be|youtube-nocookie\\.com|instagram\\.com|threads\\.(net|com))", RegexOption.IGNORE_CASE).containsMatchIn(url)) {
                      req.addOption("--downloader", "libaria2c.so")
                  }
                  if (Regex("(youtube\\.com|youtu\\.be|youtube-nocookie\\.com)", RegexOption.IGNORE_CASE).containsMatchIn(url)) {
                      req.addOption("--http-chunk-size", "10M")
                  }
                  req.addOption("-o", dir.absolutePath + "/%(title).120s.%(ext)s")
                  val igCookies = File(filesDir, "ig_cookies.txt")
                  if (igCookies.exists() && Regex("instagram\\.com", RegexOption.IGNORE_CASE).containsMatchIn(url)) {
                      req.addOption("--cookies", igCookies.absolutePath)
                  }
                  val ytCookies = File(filesDir, "yt_cookies.txt")
                  if (ytCookies.exists() && Regex("(youtube\\.com|youtu\\.be|youtube-nocookie\\.com)", RegexOption.IGNORE_CASE).containsMatchIn(url)) {
                      req.addOption("--cookies", ytCookies.absolutePath)
                  }
                  if (client != null) {
                      req.addOption("--extractor-args", "youtube:player_client=" + client)
                  }

                  if (mode == "audio") {
                      req.addOption("-f", "ba/b")
                      req.addOption("-x")
                      req.addOption("--audio-format", "mp3")
                      req.addOption("--audio-quality", "0")
                  } else {
                      // "res" = the SMALLEST side of the video, so 720p means the same for vertical and horizontal videos.
                      // level 0: separate video+audio (merged), level 1: single progressive file, level 2: anything.
                      if (level >= 2) {
                          req.addOption("-f", "b*")
                      } else {
                          req.addOption("-f", if (level == 0) "bv*+ba/b" else "b/bv*+ba")
                          if (mode == "best") {
                              req.addOption("-S", "res,ext")
                          } else {
                              req.addOption("-S", "res:" + mode + ",ext")
                          }
                      }
                      req.addOption("--merge-output-format", "mp4")
                  }
                  return req
              }

              private fun download(rawUrl: String, mode: String, item: DlItem) {
                  val url = resolveShare(rawUrl)
                  val q = when (mode) {
                      "best" -> "بهترین کیفیت"
                      "audio" -> "MP3"
                      else -> mode + "p"
                  }
                  Bus.post("⏳ شروع (" + q + "): $url")
                  item.state = 1
                  DlQueue.changed()
                  notify(1, progressNotif(item))
                  Engine.ensureInit(this)

                  val dir = File(cacheDir, "dl_" + System.currentTimeMillis())
                  dir.mkdirs()

                  var updated = false

                  val isYoutube = Regex("(youtube\\.com|youtu\\.be|youtube-nocookie\\.com)", RegexOption.IGNORE_CASE).containsMatchIn(url)
                  val isThreads = Regex("threads\\.(net|com)", RegexOption.IGNORE_CASE).containsMatchIn(url)
                  val isInsta = Regex("instagram\\.com", RegexOption.IGNORE_CASE).containsMatchIn(url)
                  val clients: List<Triple<String, String?, Int>> = when {
                      isYoutube -> (if (File(filesDir, "yt_cookies.txt").exists()) listOf<String?>(null, "tv,web_safari", "mweb") else listOf<String?>(null, "android_vr", "tv,web_safari"))
                          .map { Triple<String, String?, Int>(url, it, 0) } + Triple<String, String?, Int>(url, null, 1)
                      isThreads -> threadsUrls(url).map { Triple<String, String?, Int>(it, null, 0) }
                      else -> listOf(
                          Triple<String, String?, Int>(url, null, 0),
                          Triple<String, String?, Int>(url, null, 1),
                          Triple<String, String?, Int>(url, null, 2)
                      )
                  }

                  var lastPct = -1
                  var lastErr: Throwable? = null
                  var ci = 0
                  var directOk = false
                  if (isThreads) {
                      Bus.post("🔎 Threads: دریافت مستقیم…")
                      try {
                          directOk = directThreads(url, dir)
                      } catch (e: Throwable) {
                      }
                      if (!directOk) Bus.post("⚠️ Threads مستقیم: " + directLog.take(300))
                  }
                  while (!directOk && ci < clients.size) {
                      if (item.cancelled) break
                      try {
                          dir.listFiles()?.forEach { it.delete() }
                          val req = buildRequest(clients[ci].first, mode, dir, clients[ci].second, clients[ci].third)
                          val pid = "dl_" + System.currentTimeMillis()
                          item.processId = pid
                          if (item.cancelled) break
                          YoutubeDL.getInstance().execute(req, pid) { progress, eta, line ->
                              onProgress(item, progress, eta, line)
                          }
                          val ok = dir.listFiles()?.any {
                              it.isFile && it.extension.lowercase() !in setOf("part", "ytdl", "temp") &&
                                  (!isThreads || hasVideo(it))
                          } ?: false
                          if (!ok) throw RuntimeException("فایلی دانلود نشد")
                          lastErr = null
                          break
                      } catch (t: Throwable) {
                          lastErr = t
                          if (item.cancelled) break
                          val em = (t.message ?: t.toString())
                          Bus.post("⚠️ " + em.trim().lines().last().take(160))
                          if (isYoutube && em.contains("429")) {
                              Bus.post("⛔ یوتیوب این شبکه را موقتاً محدود کرده (429). چند ساعت صبر کن یا شبکه را عوض کن؛ تلاش بیشتر فقط محدودیت را طولانی‌تر می‌کند.")
                              break
                          }
                          if (isYoutube && em.contains("Sign in") && !File(filesDir, "yt_cookies.txt").exists()) {
                              Bus.post("💡 از دکمهٔ «ورود به یوتیوب» در صفحهٔ اصلی استفاده کن.")
                          }
                          if (!updated) {
                              updated = true
                              Bus.post("🔄 به‌روزرسانی موتور و تلاش دوباره…")
                              try {
                                  Engine.update(this)
                              } catch (e: Throwable) {
                              }
                          } else {
                              ci++
                              if (ci < clients.size) Bus.post("↻ تلاش دوباره با روش دیگر (" + ci + ")…")
                          }
                      }
                  }
                  if (item.cancelled) {
                      dir.deleteRecursively()
                      Bus.post("🚫 دانلود لغو شد: " + item.title)
                      return
                  }
                  if (lastErr != null && isInsta) {
                      try {
                          Bus.post("↻ تلاش با روش مستقیم…")
                          dir.listFiles()?.forEach { it.delete() }
                          if (directThreads(url, dir)) lastErr = null
                          else Bus.post("⚠️ روش مستقیم: " + directLog.take(300))
                      } catch (e: Throwable) {
                      }
                  }
                  if (lastErr != null) {
                      dir.deleteRecursively()
                      throw lastErr
                  }

                  val files = dir.listFiles()?.filter {
                      it.isFile && it.extension.lowercase() !in setOf("part", "ytdl", "temp")
                  } ?: emptyList()

                  if (files.isEmpty()) throw RuntimeException("فایلی دانلود نشد")

                  for (f in files) {
                      item.state = 2
                      DlQueue.changed()
                      notify(1, buildNotif("در حال ذخیره…", -1, true))
                      val saved = saveToPublic(f)
                      Bus.post("✅ ذخیره شد: " + f.name)
                      val title = f.name.substringBeforeLast('.').replace(Regex("\\s*\\[(?=[^\\]]*\\d)[\\w-]{6,}\\]\\s*\$"), "")
                      notify(nid.incrementAndGet(), buildNotif("✅ " + f.name, -1, false, openIntent(saved, title)))
                  }
                  dir.deleteRecursively()
              }

              // Tapping the "done" notification plays the video inside the app.
              // The player becomes the root of a fresh task, so Back closes player + app together.
              private fun openIntent(uri: Uri, title: String): PendingIntent {
                  val i = Intent(this, PlayerActivity::class.java)
                  i.putExtra("uri", uri.toString())
                  i.putExtra("title", title)
                  i.putExtra("fromNotif", true)
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TASK)
                  return PendingIntent.getActivity(
                      this,
                      nid.incrementAndGet(),
                      i,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
              }

              // ---------- Threads helpers ----------
              // Short "share" links (threads.com/share/XXXX) hide the real post address; resolve it first.
              private fun resolveShare(u: String): String {
                  if (!u.contains("/share/")) return u
                  if (!Regex("threads\\.(net|com)|instagram\\.com", RegexOption.IGNORE_CASE).containsMatchIn(u)) return u
                  val uas = listOf(
                      "Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36",
                      "facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)"
                  )
                  for (ua in uas) {
                      try {
                          val c = URL(u).openConnection() as HttpURLConnection
                          c.connectTimeout = 20000
                          c.readTimeout = 25000
                          c.instanceFollowRedirects = true
                          c.setRequestProperty("User-Agent", ua)
                          c.setRequestProperty("Accept-Language", "en-US,en;q=0.9")
                          val code = c.responseCode
                          val fin = c.url.toString()
                          if (!fin.contains("/share/")) {
                              c.disconnect()
                              return fin
                          }
                          var body = ""
                          if (code in 200..299) body = c.inputStream.use { it.readBytes() }.toString(Charsets.UTF_8)
                          c.disconnect()
                          val m = Regex("(?:og:url|canonical)[^>]*?(?:content|href)=[\"'](https?://[^\"']+/(?:post|p|reel)/[A-Za-z0-9_-]+)", RegexOption.IGNORE_CASE).find(body)
                          if (m != null) return m.groupValues[1]
                          val m2 = Regex("https?:(?:\\\\+/|/){2}(?:www\\.)?threads\\.(?:net|com)(?:\\\\+/|/)@[A-Za-z0-9._]+(?:\\\\+/|/)post(?:\\\\+/|/)[A-Za-z0-9_-]+").find(body)
                          if (m2 != null) return cleanLink(m2.value)
                      } catch (e: Throwable) {
                      }
                  }
                  return u
              }

              private fun threadsUrls(url: String): List<String> {
                  val clean = url.substringBefore('?').substringBefore('#')
                  val net = clean.replace("threads.com", "threads.net", true)
                  val com = clean.replace("threads.net", "threads.com", true)
                  return listOf(net, com).distinct()
              }

              private fun httpGet(u: String, ua: String): String {
                  val c = URL(u).openConnection() as HttpURLConnection
                  c.connectTimeout = 20000
                  c.readTimeout = 25000
                  c.instanceFollowRedirects = true
                  c.setRequestProperty("User-Agent", ua)
                  c.setRequestProperty("Accept-Language", "en-US,en;q=0.9")
                  c.setRequestProperty("Accept", "text/html,application/xhtml+xml,*/*;q=0.8")
                  if (u.contains("instagram.com")) {
                      val ck = getSharedPreferences("prefs", MODE_PRIVATE).getString("igCookie", null)
                      if (!ck.isNullOrEmpty()) c.setRequestProperty("Cookie", ck)
                  }
                  val code = c.responseCode
                  if (code !in 200..299) {
                      c.disconnect()
                      throw RuntimeException("HTTP " + code)
                  }
                  val text = c.inputStream.use { it.readBytes() }.toString(Charsets.UTF_8)
                  c.disconnect()
                  return text
              }

              private fun httpDownload(u: String, ua: String, out: File) {
                  val c = URL(u).openConnection() as HttpURLConnection
                  c.connectTimeout = 20000
                  c.readTimeout = 30000
                  c.instanceFollowRedirects = true
                  c.setRequestProperty("User-Agent", ua)
                  if (c.responseCode !in 200..299) {
                      val code = c.responseCode
                      c.disconnect()
                      throw RuntimeException("HTTP " + code)
                  }
                  c.inputStream.use { i -> out.outputStream().use { o -> i.copyTo(o) } }
                  c.disconnect()
              }

              private fun cleanLink(s: String): String {
                  var x = s
                  while (x.contains("\\\\")) x = x.replace("\\\\", "\\")
                  return x.replace("\\u0026", "&").replace("\\u0025", "%").replace("\\/", "/")
                      .replace("&amp;", "&").trimEnd('\\')
              }

              // Returns candidate video links, most trustworthy first (og:video of THIS post, then
              // video_versions nearest to this post's code, then generic fallbacks). Audio-ish links are dropped.
              private fun findVideoUrls(html: String, id: String): List<String> {
                  val out = ArrayList<String>()
                  val og = listOf(
                      Regex("<meta[^>]+(?:property|name)=[\"']og:video(?::secure_url|:url)?[\"'][^>]*content=[\"']([^\"']+)[\"']", RegexOption.IGNORE_CASE),
                      Regex("<meta[^>]+content=[\"']([^\"']+)[\"'][^>]*(?:property|name)=[\"']og:video(?::secure_url|:url)?[\"']", RegexOption.IGNORE_CASE)
                  )
                  for (p in og) {
                      for (m in p.findAll(html)) out.add(cleanLink(m.groupValues[1]))
                  }

                  val codePos = html.indexOf("\"code\":\"" + id + "\"")
                  val vv = Regex("\"video_versions\"\\s*:\\s*\\[\\s*\\{[^\\]]*?\"url\"\\s*:\\s*\"([^\"]+)\"")
                  val found = vv.findAll(html).toList()
                  val sorted = if (codePos >= 0) found.sortedBy { Math.abs(it.range.first - codePos) } else found
                  for (m in sorted) out.add(cleanLink(m.groupValues[1]))

                  val rest = listOf(
                      Regex("<video[^>]+src=[\"']([^\"']+)[\"']", RegexOption.IGNORE_CASE),
                      Regex("\"video_url\"\\s*:\\s*\"([^\"]+)\""),
                      Regex("(https?:(?:\\\\+/|/){2}[^\"'\\s<>]+?\\.mp4[^\"'\\s<>]*)")
                  )
                  for (p in rest) {
                      for (m in p.findAll(html)) out.add(cleanLink(m.groupValues[1]))
                  }
                  return out.filter { it.startsWith("http") && !it.contains("audio", true) }.distinct()
              }

              private fun hasVideo(f: File): Boolean {
                  val r = MediaMetadataRetriever()
                  return try {
                      r.setDataSource(f.absolutePath)
                      r.extractMetadata(MediaMetadataRetriever.METADATA_KEY_HAS_VIDEO) == "yes"
                  } catch (e: Throwable) {
                      false
                  } finally {
                      try {
                          r.release()
                      } catch (e: Throwable) {
                      }
                  }
              }

              // Reads the video link straight from the Threads page and keeps only a file that really has a picture.
              private fun directUrls(url: String): List<String> {
                  if (Regex("instagram\\.com", RegexOption.IGNORE_CASE).containsMatchIn(url)) {
                      val iid = Regex("/(?:p|reel|reels|tv)/([A-Za-z0-9_-]+)").find(url)?.groupValues?.get(1)
                      if (iid != null) {
                          return listOf(
                              "https://www.instagram.com/p/" + iid + "/embed/captioned/",
                              "https://www.instagram.com/reel/" + iid + "/embed/",
                              "https://www.instagram.com/p/" + iid + "/"
                          )
                      }
                      return listOf(url.substringBefore('?'))
                  }
                  val b = threadsUrls(url)
                  return b + b.map { it.trimEnd('/') + "/embed" }
              }

              private fun directThreads(url: String, dir: File): Boolean {
                  val uas = listOf(
                      "facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)",
                      "Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36",
                      "Twitterbot/1.0"
                  )
                  val id = Regex("/(?:post|p|reel|reels|tv)/([A-Za-z0-9_-]+)").find(url)?.groupValues?.get(1) ?: System.currentTimeMillis().toString()
                  val cands = directUrls(url)
                  directLog = ""
                  for (u in cands) {
                      for (ua in uas) {
                          try {
                              val html = httpGet(u, ua)
                              val links = findVideoUrls(html, id)
                              if (links.isEmpty()) {
                                  directLog += "no-video(" + html.length + ") "
                                  continue
                              }
                              for (v in links.take(6)) {
                                  val f = File(dir, "Threads [" + id + "].mp4")
                                  try {
                                      httpDownload(v, ua, f)
                                      if (f.length() > 10000L && hasVideo(f)) return true
                                      directLog += "not-video "
                                  } catch (e: Throwable) {
                                      directLog += (e.message ?: e.javaClass.simpleName).take(40) + " "
                                  }
                                  f.delete()
                              }
                          } catch (e: Throwable) {
                              directLog += (e.message ?: e.javaClass.simpleName).take(40) + " "
                          }
                      }
                  }
                  return false
              }

              private var directLog = ""

              private fun saveToPublic(file: File): Uri {
                  val ext = file.extension.lowercase()
                  val mime = MimeTypeMap.getSingleton().getMimeTypeFromExtension(ext) ?: "application/octet-stream"
                  val isAudio = mime.startsWith("audio")
                  val isVideo = mime.startsWith("video")
                  val isImage = mime.startsWith("image")

                  if (Build.VERSION.SDK_INT >= 29) {
                      val (collection, rel) = when {
                          isAudio -> Pair(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, Environment.DIRECTORY_MUSIC + "/Downloader")
                          isVideo -> Pair(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, Environment.DIRECTORY_MOVIES + "/Downloader")
                          isImage -> Pair(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, Environment.DIRECTORY_PICTURES + "/Downloader")
                          else -> Pair(MediaStore.Downloads.EXTERNAL_CONTENT_URI, Environment.DIRECTORY_DOWNLOADS + "/Downloader")
                      }
                      val values = ContentValues().apply {
                          put(MediaStore.MediaColumns.DISPLAY_NAME, file.name)
                          put(MediaStore.MediaColumns.MIME_TYPE, mime)
                          put(MediaStore.MediaColumns.RELATIVE_PATH, rel)
                          put(MediaStore.MediaColumns.IS_PENDING, 1)
                      }
                      val uri = contentResolver.insert(collection, values)
                          ?: throw RuntimeException("ذخیره در حافظه ممکن نشد")
                      contentResolver.openOutputStream(uri)!!.use { out ->
                          file.inputStream().use { it.copyTo(out) }
                      }
                      val done = ContentValues().apply { put(MediaStore.MediaColumns.IS_PENDING, 0) }
                      contentResolver.update(uri, done, null, null)
                      return uri
                  } else {
                      val base = Environment.getExternalStoragePublicDirectory(
                          when {
                              isAudio -> Environment.DIRECTORY_MUSIC
                              isVideo -> Environment.DIRECTORY_MOVIES
                              else -> Environment.DIRECTORY_DOWNLOADS
                          }
                      )
                      val target = File(base, "Downloader")
                      target.mkdirs()
                      var out = File(target, file.name)
                      var n = 1
                      while (out.exists()) {
                          out = File(target, file.name.substringBeforeLast('.') + " (" + n + ")." + file.extension)
                          n++
                      }
                      file.copyTo(out, overwrite = false)
                      MediaScannerConnection.scanFile(this, arrayOf(out.absolutePath), arrayOf(mime), null)
                      return Uri.fromFile(out)
                  }
              }

              private val sizeRe = Regex("(\\d+(?:\\.\\d+)?)%\\s+of\\s+~?\\s*(\\d+(?:\\.\\d+)?)\\s*([KMGT]?)i?B")
              private val speedRe = Regex("at\\s+(\\S+/s)")
              private val etaRe = Regex("ETA\\s+(\\S+)")
              private val destRe = Regex("Destination:\\s*(.+?)\\s*\$")
              private var lastNotifAt = 0L

              // Reads yt-dlp's progress line: "[download]  45.3% of ~ 27.10MiB at 1.20MiB/s ETA 00:05"
              private fun onProgress(item: DlItem, progress: Float, eta: Long, line: String) {
                  if (item.cancelled) return
                  val dm = destRe.find(line)
                  if (dm != null) {
                      val base = File(dm.groupValues[1]).name.substringBeforeLast('.')
                      val t = base.replace(Regex("\\s*\\[(?=[^\\]]*\\d)[\\w-]{6,}\\]\\s*\$"), "")
                      if (t.isNotBlank()) item.title = t
                  }
                  val m = sizeRe.find(line)
                  if (m != null) {
                      val unit = when (m.groupValues[3]) {
                          "K" -> 1024.0
                          "M" -> 1048576.0
                          "G" -> 1073741824.0
                          "T" -> 1099511627776.0
                          else -> 1.0
                      }
                      val pc = m.groupValues[1].toDouble()
                      val tot = (m.groupValues[2].toDouble() * unit).toLong()
                      item.total = tot
                      item.done = (tot * (pc / 100.0)).toLong()
                      item.pct = pc.toInt().coerceIn(0, 100)
                  } else if (progress >= 0f) {
                      item.pct = progress.toInt().coerceIn(0, 100)
                  }
                  speedRe.find(line)?.let { item.speed = it.groupValues[1] }
                  etaRe.find(line)?.let { item.eta = it.groupValues[1] }
                  item.state = 1
                  DlQueue.changed()
                  val now = System.currentTimeMillis()
                  if (now - lastNotifAt > 700 || item.pct >= 100) {
                      lastNotifAt = now
                      notify(1, progressNotif(item))
                  }
              }

              private fun progressNotif(item: DlItem): android.app.Notification {
                  val queued = DlQueue.snapshot().count { it.state == 0 && !it.cancelled }
                  val text = when {
                      item.total > 0 && item.pct >= 0 -> item.pct.toString() + "% • " + fmtBytes(item.done) + " از " + fmtBytes(item.total)
                      item.pct >= 0 -> item.pct.toString() + "%"
                      else -> "در حال آماده‌سازی…"
                  }
                  val sub = listOf(
                      item.speed,
                      if (item.eta.isNotEmpty()) "ETA " + item.eta else "",
                      if (queued > 0) queued.toString() + " در صف" else ""
                  ).filter { it.isNotEmpty() }.joinToString(" • ")
                  return buildNotif(text, item.pct, true, null, if (sub.isEmpty()) null else sub, item.title + "\n" + text)
              }

              // Tapping the progress notification opens the downloads page, which lists the queue at the top.
              private fun queueIntent(): PendingIntent {
                  val i = Intent(this, DownloadsActivity::class.java)
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP or Intent.FLAG_ACTIVITY_SINGLE_TOP)
                  return PendingIntent.getActivity(this, 4242, i, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
              }

              private fun ensureChannel() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      val ch = NotificationChannel("dl", "دانلودها", NotificationManager.IMPORTANCE_LOW)
                      getSystemService(NotificationManager::class.java).createNotificationChannel(ch)
                  }
              }

              private fun buildNotif(text: String, pct: Int, ongoing: Boolean, tapIntent: PendingIntent? = null, sub: String? = null, big: String? = null) =
                  NotificationCompat.Builder(this, "dl")
                      .setSmallIcon(if (ongoing) android.R.drawable.stat_sys_download else android.R.drawable.stat_sys_download_done)
                      .setContentTitle("Downloader")
                      .setContentText(text)
                      .setOngoing(ongoing)
                      .setOnlyAlertOnce(true)
                      .apply {
                          if (pct >= 0) setProgress(100, pct, false)
                          else if (ongoing) setProgress(0, 0, true)
                          if (tapIntent != null) {
                          setContentIntent(tapIntent)
                          setAutoCancel(true)
                          } else if (ongoing) {
                          setContentIntent(queueIntent())
                          }
                          if (sub != null) setSubText(sub)
                          if (big != null) setStyle(NotificationCompat.BigTextStyle().bigText(big))
                      }
                      .build()

              private fun notify(id: Int, n: android.app.Notification) {
                  try {
                      getSystemService(NotificationManager::class.java).notify(id, n)
                  } catch (_: Throwable) {
                  }
              }
          }
