              private fun sp(ctx: Context) = ctx.getSharedPreferences("prefs", Context.MODE_PRIVATE)

              fun askAll(ctx: Context): Boolean = sp(ctx).getBoolean("qs_all", false)
              fun setAskAll(ctx: Context, v: Boolean) {
                  sp(ctx).edit().putBoolean("qs_all", v).apply()
              }

              fun platOn(ctx: Context): Set<String> = HashSet(sp(ctx).getStringSet("qs_plat_on", emptySet()) ?: emptySet())
              fun setPlat(ctx: Context, id: String, on: Boolean) {
                  val s = HashSet(platOn(ctx))
                  if (on) s.add(id) else s.remove(id)
                  sp(ctx).edit().putStringSet("qs_plat_on", s).apply()
              }

              fun sites(ctx: Context): List<String> =
                  (sp(ctx).getString("qs_sites", "") ?: "").split("\n").map { it.trim() }.filter { it.isNotEmpty() }

              fun sitesOn(ctx: Context): Set<String> = HashSet(sp(ctx).getStringSet("qs_sites_on", emptySet()) ?: emptySet())

              fun setSiteOn(ctx: Context, host: String, on: Boolean) {
                  val s = HashSet(sitesOn(ctx))
                  if (on) s.add(host) else s.remove(host)
                  sp(ctx).edit().putStringSet("qs_sites_on", s).apply()
              }

              fun normalizeHost(raw: String): String? {
                  var s = raw.trim().lowercase()
                  s = s.removePrefix("https://").removePrefix("http://")
                  s = s.substringBefore("/").substringBefore("?").substringBefore("#").substringBefore(":")
                  s = s.removePrefix("www.")
                  if (s.isEmpty() || !s.contains(".") || s.contains(" ") || s.startsWith(".") || s.endsWith(".")) return null
                  return s
              }

              fun addSite(ctx: Context, host: String) {
                  val l = ArrayList(sites(ctx))
                  if (!l.contains(host)) l.add(host)
                  sp(ctx).edit().putString("qs_sites", l.joinToString("\n")).apply()
                  setSiteOn(ctx, host, true)
              }

              fun removeSite(ctx: Context, host: String) {
                  val l = ArrayList(sites(ctx))
                  l.remove(host)
                  sp(ctx).edit().putString("qs_sites", l.joinToString("\n")).apply()
                  setSiteOn(ctx, host, false)
              }

              fun hostOf(url: String): String {
                  return try {
                      (Uri.parse(url).host ?: "").lowercase().removePrefix("www.")
                  } catch (e: Exception) {
                      ""
                  }
              }

              private fun matches(host: String, domain: String): Boolean = host == domain || host.endsWith("." + domain)

              fun platformFor(host: String): Platform? {
                  var best: Platform? = null
                  var bestLen = 0
                  for (p in platforms) {
                      for (d in p.domains) {
                          if (matches(host, d) && d.length > bestLen) {
                              best = p
                              bestLen = d.length
                          }
                      }
                  }
                  return best
              }

              fun platformForPackage(pkg: String?): Platform? {
                  if (pkg == null) return null
                  for (p in platforms) if (p.packages.contains(pkg)) return p
                  return null
              }

              // True when the quality must be asked before downloading this link.
              // srcPkg = package of the app the link was shared from (null if unknown).
              // - Shared from a known platform app (Instagram, YouTube, ...): ONLY that platform's own
              //   checkbox decides. "Ask for all sites" does NOT apply to apps.
              // - Shared from a browser / other app: "Ask for all sites" applies, otherwise per-site rules.
              fun shouldAsk(ctx: Context, url: String, srcPkg: String?): Boolean {
                  val host = hostOf(url)
                  val srcPlat = platformForPackage(srcPkg)
                  if (srcPlat != null) return platOn(ctx).contains(srcPlat.id)
                  // Source unknown: a link of a known platform is treated as coming from its app.
                  val unknownSrc = srcPkg == null
                  val hostPlat = if (host.isEmpty()) null else platformFor(host)
                  if (unknownSrc && hostPlat != null) return platOn(ctx).contains(hostPlat.id)
                  if (askAll(ctx)) return true
                  if (host.isEmpty()) return false
                  val on = sitesOn(ctx)
                  for (s in sites(ctx)) {
                      if (on.contains(s) && matches(host, s)) return true
                  }
                  val pl = platformFor(host)
                  if (pl != null && platOn(ctx).contains(pl.id)) return true
                  return false
              }

              fun summary(ctx: Context): String {
                  val sites = sites(ctx)
                  val n = platOn(ctx).size + sitesOn(ctx).count { sites.contains(it) }
                  if (askAll(ctx)) return if (platOn(ctx).isEmpty()) "برای همه سایت‌های مرورگر کیفیت پرسیده می‌شود"
                  else "برای همه سایت‌های مرورگر و " + platOn(ctx).size + " اپلیکیشن کیفیت پرسیده می‌شود"
                  return if (n == 0) "هیچ موردی فعال نیست • با کیفیت پیش‌فرض دانلود می‌شود"
                  else "کیفیت برای " + n + " مورد پرسیده می‌شود • برای تنظیم بزن"
              }

              fun icon(ctx: Context, p: Platform): Drawable? {
                  for (pk in p.packages) {
                      try {
                          return ctx.packageManager.getApplicationIcon(pk)
                      } catch (e: Exception) {
                      }
                  }
                  return null
              }
          }

