              private fun doDelete() {
                  val sel = items.filter { it.key in selected }
                  val failed = ArrayList<Item>()
                  var ok = 0
                  for (i in sel) {
                      try {
                          contentResolver.delete(i.uri, null, null)
                          ok++
                      } catch (e: SecurityException) {
                          failed.add(i)
