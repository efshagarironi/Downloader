name: Build ShareDL APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android project
        run: |
          mkdir -p app/src/main/java/com/sharedl/app
          mkdir -p app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26 app/src/main/res/mipmap-anydpi

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'ShareDL'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.sharedl.app'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.sharedl.app'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
                  ndk {
                      abiFilters 'arm64-v8a', 'armeabi-v7a'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }

              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
              implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission
                  android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />
              <uses-permission
                  android:name="android.permission.READ_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />

              <application
                  android:label="دانلودر ویدئو"
                  android:icon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:largeHeap="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".DownloadsActivity"
                      android:exported="false" />

                  <activity
                      android:name=".PlayerActivity"
                      android:exported="false"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden|uiMode"
                      android:theme="@android:style/Theme.Material.NoActionBar.Fullscreen" />

                  <service
                      android:name=".DownloadService"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/sharedl/app/Core.kt <<'EOF'
          package com.sharedl.app

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.ContentValues
          import android.content.Context
          import android.content.Intent
          import android.media.MediaScannerConnection
          import android.os.Build
          import android.os.Environment
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.provider.MediaStore
          import android.webkit.MimeTypeMap
          import androidx.core.app.NotificationCompat
          import com.yausername.ffmpeg.FFmpeg
          import com.yausername.youtubedl_android.YoutubeDL
          import com.yausername.youtubedl_android.YoutubeDLRequest
          import java.io.File
          import java.util.concurrent.Executors
          import java.util.concurrent.atomic.AtomicInteger

          object Bus {
              private val log = StringBuilder()
              private val handler = Handler(Looper.getMainLooper())
              var onChange: (() -> Unit)? = null

              fun post(msg: String) {
                  synchronized(log) {
                      log.append(msg).append("\n\n")
                      if (log.length > 20000) log.delete(0, log.length - 15000)
                  }
                  handler.post { onChange?.invoke() }
              }

              fun snapshot(): String = synchronized(log) { log.toString() }
          }

          object Engine {
              private var ready = false

              @Synchronized
              fun ensureInit(ctx: Context) {
                  if (ready) return
                  val app = ctx.applicationContext
                  YoutubeDL.getInstance().init(app)
                  FFmpeg.getInstance().init(app)
                  ready = true
              }
          }

          class DownloadService : Service() {

              private val exec = Executors.newSingleThreadExecutor()
              private val pending = AtomicInteger(0)

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  ensureChannel()
                  startForeground(1, buildNotif("در صف دانلود…", -1, true))
                  val url = intent?.getStringExtra("url")
                  val mode = intent?.getStringExtra("mode") ?: "720"
                  if (url == null) {
                      if (pending.get() == 0) {
                          stopForeground(true)
                          stopSelf()
                      }
                      return START_NOT_STICKY
                  }
                  pending.incrementAndGet()
                  exec.execute {
                      try {
                          download(url, mode)
                      } catch (t: Throwable) {
                          val m = (t.message ?: t.toString()).take(400)
                          Bus.post("❌ خطا: $m")
                          notify(2, buildNotif("❌ دانلود ناموفق بود", -1, false))
                      } finally {
                          if (pending.decrementAndGet() == 0) {
                              stopForeground(true)
                              stopSelf()
                          }
                      }
                  }
                  return START_NOT_STICKY
              }

              private fun download(url: String, mode: String) {
                  Bus.post("⏳ شروع: $url")
                  Engine.ensureInit(this)

                  val dir = File(cacheDir, "dl_" + System.currentTimeMillis())
                  dir.mkdirs()

                  val req = YoutubeDLRequest(url)
                  req.addOption("--no-playlist")
                  req.addOption("--no-mtime")
                  req.addOption("-o", dir.absolutePath + "/%(title).80s [%(id)s].%(ext)s")

                  if (mode == "audio") {
                      req.addOption("-x")
                      req.addOption("--audio-format", "mp3")
                      req.addOption("--audio-quality", "0")
                  } else {
                      val f = if (mode == "best") {
                          "bv*[ext=mp4]+ba[ext=m4a]/b[ext=mp4]/bv*+ba/b"
                      } else {
                          "bv*[height<=$mode][ext=mp4]+ba[ext=m4a]/b[height<=$mode][ext=mp4]/bv*[height<=$mode]+ba/b[height<=$mode]/b"
                      }
                      req.addOption("-f", f)
                      req.addOption("--merge-output-format", "mp4")
                  }

                  var lastPct = -1
                  YoutubeDL.getInstance().execute(req, "dl_" + System.currentTimeMillis()) { progress, _, _ ->
                      val p = progress.toInt()
                      if (p != lastPct && p in 0..100) {
                          lastPct = p
                          notify(1, buildNotif("در حال دانلود… $p%", p, true))
                      }
                  }

                  val files = dir.listFiles()?.filter {
                      it.isFile && it.extension.lowercase() !in setOf("part", "ytdl", "temp")
                  } ?: emptyList()

                  if (files.isEmpty()) throw RuntimeException("فایلی دانلود نشد")

                  for (f in files) {
                      notify(1, buildNotif("در حال ذخیره…", -1, true))
                      saveToPublic(f)
                      Bus.post("✅ ذخیره شد: " + f.name)
                      notify(2, buildNotif("✅ " + f.name, -1, false))
                  }
                  dir.deleteRecursively()
              }

              private fun saveToPublic(file: File) {
                  val ext = file.extension.lowercase()
                  val mime = MimeTypeMap.getSingleton().getMimeTypeFromExtension(ext) ?: "application/octet-stream"
                  val isAudio = mime.startsWith("audio")
                  val isVideo = mime.startsWith("video")
                  val isImage = mime.startsWith("image")

                  if (Build.VERSION.SDK_INT >= 29) {
                      val (collection, rel) = when {
                          isAudio -> Pair(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, Environment.DIRECTORY_MUSIC + "/ShareDL")
                          isVideo -> Pair(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, Environment.DIRECTORY_MOVIES + "/ShareDL")
                          isImage -> Pair(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, Environment.DIRECTORY_PICTURES + "/ShareDL")
                          else -> Pair(MediaStore.Downloads.EXTERNAL_CONTENT_URI, Environment.DIRECTORY_DOWNLOADS + "/ShareDL")
                      }
                      val values = ContentValues().apply {
                          put(MediaStore.MediaColumns.DISPLAY_NAME, file.name)
                          put(MediaStore.MediaColumns.MIME_TYPE, mime)
                          put(MediaStore.MediaColumns.RELATIVE_PATH, rel)
                          put(MediaStore.MediaColumns.IS_PENDING, 1)
                      }
                      val uri = contentResolver.insert(collection, values)
                          ?: throw RuntimeException("ذخیره در حافظه ممکن نشد")
                      contentResolver.openOutputStream(uri)!!.use { out ->
                          file.inputStream().use { it.copyTo(out) }
                      }
                      val done = ContentValues().apply { put(MediaStore.MediaColumns.IS_PENDING, 0) }
                      contentResolver.update(uri, done, null, null)
                  } else {
                      val base = Environment.getExternalStoragePublicDirectory(
                          when {
                              isAudio -> Environment.DIRECTORY_MUSIC
                              isVideo -> Environment.DIRECTORY_MOVIES
                              else -> Environment.DIRECTORY_DOWNLOADS
                          }
                      )
                      val target = File(base, "ShareDL")
                      target.mkdirs()
                      val out = File(target, file.name)
                      file.copyTo(out, overwrite = true)
                      MediaScannerConnection.scanFile(this, arrayOf(out.absolutePath), arrayOf(mime), null)
                  }
              }

              private fun ensureChannel() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      val ch = NotificationChannel("dl", "دانلودها", NotificationManager.IMPORTANCE_LOW)
                      getSystemService(NotificationManager::class.java).createNotificationChannel(ch)
                  }
              }

              private fun buildNotif(text: String, pct: Int, ongoing: Boolean) =
                  NotificationCompat.Builder(this, "dl")
                      .setSmallIcon(if (ongoing) android.R.drawable.stat_sys_download else android.R.drawable.stat_sys_download_done)
                      .setContentTitle("دانلودر ویدئو")
                      .setContentText(text)
                      .setOngoing(ongoing)
                      .setOnlyAlertOnce(true)
                      .apply {
                          if (pct >= 0) setProgress(100, pct, false)
                          else if (ongoing) setProgress(0, 0, true)
                      }
                      .build()

              private fun notify(id: Int, n: android.app.Notification) {
                  try {
                      getSystemService(NotificationManager::class.java).notify(id, n)
                  } catch (_: Throwable) {
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/sharedl/app/Ui.kt <<'EOF'
          package com.sharedl.app

          import android.content.Context
          import android.graphics.Color
          import android.graphics.Outline
          import android.graphics.drawable.GradientDrawable
          import android.view.View
          import android.view.ViewOutlineProvider
          import java.util.Locale

          object Ui {
              val BG_TOP: Int = Color.parseColor("#0B1220")
              val BG_BOTTOM: Int = Color.parseColor("#13243F")
              val CARD: Int = Color.parseColor("#1A2438")
              val CARD_STROKE: Int = Color.parseColor("#2A3A57")
              val FIELD: Int = Color.parseColor("#0F1829")
              val GREEN: Int = Color.parseColor("#22C55E")
              val GREEN_DARK: Int = Color.parseColor("#16A34A")
              val GREEN_SEL: Int = Color.parseColor("#123B27")
              val TEXT: Int = Color.parseColor("#F1F5F9")
              val MUTED: Int = Color.parseColor("#94A3B8")
              val DANGER: Int = Color.parseColor("#EF4444")

              fun dp(ctx: Context, x: Int): Int = (x * ctx.resources.displayMetrics.density).toInt()

              fun rect(ctx: Context, fill: Int, radiusDp: Int, stroke: Int = 0, strokeDp: Int = 0): GradientDrawable {
                  val g = GradientDrawable()
                  g.setColor(fill)
                  g.setCornerRadius(dp(ctx, radiusDp).toFloat())
                  if (strokeDp > 0) g.setStroke(dp(ctx, strokeDp), stroke)
                  return g
              }

              fun grad(ctx: Context, from: Int, to: Int, radiusDp: Int): GradientDrawable {
                  val g = GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT, intArrayOf(from, to))
                  g.setCornerRadius(dp(ctx, radiusDp).toFloat())
                  return g
              }

              fun oval(fill: Int, stroke: Int = 0, strokePx: Int = 0): GradientDrawable {
                  val g = GradientDrawable()
                  g.setShape(GradientDrawable.OVAL)
                  g.setColor(fill)
                  if (strokePx > 0) g.setStroke(strokePx, stroke)
                  return g
              }

              fun pageBg(): GradientDrawable =
                  GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM, intArrayOf(BG_TOP, BG_BOTTOM))

              fun roundClip(v: View, radiusDp: Int) {
                  val r = dp(v.context, radiusDp).toFloat()
                  v.outlineProvider = object : ViewOutlineProvider() {
                      override fun getOutline(view: View?, outline: Outline?) {
                          outline?.setRoundRect(0, 0, view?.width ?: 0, view?.height ?: 0, r)
                      }
                  }
                  v.clipToOutline = true
              }

              fun dur(ms: Long): String {
                  val s = ms / 1000
                  val h = s / 3600
                  val m = (s % 3600) / 60
                  val sec = s % 60
                  return if (h > 0) String.format(Locale.US, "%d:%02d:%02d", h, m, sec)
                  else String.format(Locale.US, "%d:%02d", m, sec)
              }

              fun size(b: Long): String {
                  val mb = b / 1048576.0
                  return if (mb >= 1024) String.format(Locale.US, "%.2f GB", mb / 1024)
                  else String.format(Locale.US, "%.1f MB", mb)
              }
          }
          EOF

          cat > app/src/main/java/com/sharedl/app/MainActivity.kt <<'EOF'
          package com.sharedl.app

          import android.Manifest
          import android.app.Activity
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.os.Build
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.widget.EditText
          import android.widget.HorizontalScrollView
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import com.yausername.youtubedl_android.YoutubeDL

          class MainActivity : Activity() {

              private lateinit var logView: TextView
              private lateinit var input: EditText
              private val chips = ArrayList<TextView>()
              private var quality = 2
              private var pendingUrl: String? = null

              private val modes = listOf("best", "1080", "720", "480", "360", "audio")
              private val labels = listOf("بهترین کیفیت", "1080p", "720p", "480p", "360p", "فقط صدا (MP3)")
              private val urlRegex = Regex("https?://\\S+")

              private fun dp(x: Int) = Ui.dp(this, x)
              private fun rect(fill: Int, r: Int, stroke: Int = 0, sw: Int = 0) = Ui.rect(this, fill, r, stroke, sw)
              private fun grad(a: Int, b: Int, r: Int) = Ui.grad(this, a, b, r)

              private fun label(s: String, size: Float, color: Int, bold: Boolean = false): TextView {
                  val t = TextView(this)
                  t.text = s
                  t.textSize = size
                  t.setTextColor(color)
                  if (bold) t.setTypeface(t.typeface, Typeface.BOLD)
                  return t
              }

              private fun lp(top: Int = 0): LinearLayout.LayoutParams {
                  val p = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  )
                  p.topMargin = dp(top)
                  return p
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  quality = getSharedPreferences("prefs", MODE_PRIVATE).getInt("q", 2).coerceIn(0, labels.size - 1)
                  buildUi()
                  refreshLog()

                  val shared = extractShared(intent)
                  if (shared != null) {
                      handleShare(shared)
                  } else {
                      val p = neededPerms(true)
                      if (p.isNotEmpty()) requestPermissions(p.toTypedArray(), 7)
                      autoUpdate()
                  }
              }

              override fun onResume() {
                  super.onResume()
                  Bus.onChange = { refreshLog() }
                  refreshLog()
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  setIntent(intent)
                  extractShared(intent)?.let { handleShare(it) }
              }

              override fun onDestroy() {
                  Bus.onChange = null
                  super.onDestroy()
              }

              private fun extractShared(i: Intent?): String? {
                  if (i?.action != Intent.ACTION_SEND) return null
                  val t = i.getStringExtra(Intent.EXTRA_TEXT) ?: return null
                  return urlRegex.find(t)?.value
              }

              private fun handleShare(url: String) {
                  val p = neededPerms(false)
                  if (p.isNotEmpty()) {
                      pendingUrl = url
                      requestPermissions(p.toTypedArray(), 7)
                  } else {
                      startDownload(url, true)
                  }
              }

              private fun neededPerms(all: Boolean): List<String> {
                  val l = ArrayList<String>()
                  if (Build.VERSION.SDK_INT >= 33) l.add(Manifest.permission.POST_NOTIFICATIONS)
                  if (Build.VERSION.SDK_INT < 29) l.add(Manifest.permission.WRITE_EXTERNAL_STORAGE)
                  if (all) {
                      if (Build.VERSION.SDK_INT >= 33) {
                          l.add(Manifest.permission.READ_MEDIA_VIDEO)
                          l.add(Manifest.permission.READ_MEDIA_AUDIO)
                      } else {
                          l.add(Manifest.permission.READ_EXTERNAL_STORAGE)
                      }
                  }
                  return l.filter { checkSelfPermission(it) != PackageManager.PERMISSION_GRANTED }
              }

              override fun onRequestPermissionsResult(code: Int, perms: Array<out String>, results: IntArray) {
                  super.onRequestPermissionsResult(code, perms, results)
                  pendingUrl?.let {
                      pendingUrl = null
                      startDownload(it, true)
                  }
              }

              private fun startDownload(url: String, finishAfter: Boolean) {
                  val idx = quality.coerceIn(0, modes.size - 1)
                  getSharedPreferences("prefs", MODE_PRIVATE).edit().putInt("q", idx).apply()

                  val i = Intent(this, DownloadService::class.java)
                  i.putExtra("url", url)
                  i.putExtra("mode", modes[idx])
                  if (Build.VERSION.SDK_INT >= 26) startForegroundService(i) else startService(i)

                  Toast.makeText(this, "دانلود شروع شد ⬇️", Toast.LENGTH_SHORT).show()
                  if (finishAfter) finish()
              }

              private fun updateEngine() {
                  Thread {
                      try {
                          Bus.post("⏳ در حال آپدیت موتور دانلود…")
                          Engine.ensureInit(applicationContext)
                          val s = YoutubeDL.getInstance().updateYoutubeDL(applicationContext)
                          getSharedPreferences("prefs", MODE_PRIVATE).edit()
                              .putLong("lastUpdate", System.currentTimeMillis()).apply()
                          Bus.post("✅ آپدیت موتور انجام شد ($s)")
                      } catch (t: Throwable) {
                          Bus.post("❌ آپدیت ناموفق: " + (t.message ?: t.toString()).take(300))
                      }
                  }.start()
              }

              private fun autoUpdate() {
                  val last = getSharedPreferences("prefs", MODE_PRIVATE).getLong("lastUpdate", 0L)
                  if (System.currentTimeMillis() - last > 24L * 3600L * 1000L) updateEngine()
              }

              private fun refreshLog() {
                  val s = Bus.snapshot().trim()
                  logView.text = if (s.isEmpty()) "هنوز دانلودی انجام نشده." else s.takeLast(1500)
              }

              private fun styleChips() {
                  chips.forEachIndexed { i, c ->
                      if (i == quality) {
                          c.background = rect(Ui.GREEN, 20)
                          c.setTextColor(Color.parseColor("#052E16"))
                      } else {
                          c.background = rect(Ui.FIELD, 20, Ui.CARD_STROKE, 1)
                          c.setTextColor(Ui.MUTED)
                      }
                  }
              }

              private fun pasteFromClipboard() {
                  val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                  val clip = cm.primaryClip
                  val t = if (clip != null && clip.itemCount > 0) clip.getItemAt(0).coerceToText(this)?.toString() else null
                  if (t.isNullOrBlank()) {
                      Toast.makeText(this, "چیزی برای چسباندن نیست", Toast.LENGTH_SHORT).show()
                  } else {
                      input.setText(t.trim())
                  }
              }

              private fun buildUi() {
                  window.statusBarColor = Ui.BG_TOP
                  window.navigationBarColor = Ui.BG_BOTTOM

                  val page = ScrollView(this)
                  page.background = Ui.pageBg()
                  page.isFillViewport = true
                  page.layoutDirection = View.LAYOUT_DIRECTION_RTL

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(dp(20), dp(24), dp(20), dp(28))
                  page.addView(root)

                  // ---------- Header ----------
                  val header = LinearLayout(this)
                  header.orientation = LinearLayout.HORIZONTAL
                  header.gravity = Gravity.CENTER_VERTICAL

                  val logo = ImageView(this)
                  logo.setImageResource(R.mipmap.ic_launcher)
                  Ui.roundClip(logo, 15)
                  header.addView(logo, LinearLayout.LayoutParams(dp(56), dp(56)))

                  val titles = LinearLayout(this)
                  titles.orientation = LinearLayout.VERTICAL
                  titles.setPaddingRelative(dp(14), 0, 0, 0)
                  titles.addView(label("دانلودر ویدئو", 24f, Ui.TEXT, true))
                  titles.addView(label("دانلود ساده و سریع از شبکه‌های اجتماعی", 12.5f, Ui.MUTED))
                  header.addView(titles)
                  root.addView(header, lp())

                  val tip = label("در یوتیوب، اینستاگرام، X، تیک‌تاک و ... روی «اشتراک‌گذاری» بزن و این برنامه را انتخاب کن.", 13f, Ui.MUTED)
                  tip.setPadding(0, dp(14), 0, dp(14))
                  root.addView(tip, lp())

                  // ---------- Download card ----------
                  val card = LinearLayout(this)
                  card.orientation = LinearLayout.VERTICAL
                  card.setPadding(dp(16), dp(16), dp(16), dp(16))
                  card.background = rect(Ui.CARD, 24, Ui.CARD_STROKE, 1)

                  card.addView(label("لینک ویدئو", 12.5f, Ui.MUTED))

                  val row = LinearLayout(this)
                  row.orientation = LinearLayout.HORIZONTAL
                  row.gravity = Gravity.CENTER_VERTICAL
