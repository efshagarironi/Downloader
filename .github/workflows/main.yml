          package com.sharedl.app

          import android.app.Activity
          import android.os.Bundle
          import android.webkit.CookieManager
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import java.io.File

          class YoutubeLoginActivity : Activity() {

              private lateinit var web: WebView
              private var done = false

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Ui.BG_TOP
                  window.navigationBarColor = Ui.BG_BOTTOM

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setBackgroundColor(Ui.BG_TOP)

                  val tip = TextView(this)
                  tip.text = "حتماً با یک حساب گوگل دوم (نه حساب اصلی) وارد شو. بعد از ورود موفق، این صفحه خودکار بسته می‌شود."
                  tip.setTextColor(Ui.MUTED)
                  tip.textSize = 13f
                  tip.setPadding(Ui.dp(this, 16), Ui.dp(this, 12), Ui.dp(this, 16), Ui.dp(this, 12))
                  root.addView(tip)

                  web = WebView(this)
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  // Google rejects sign-in inside a plain WebView, so present a regular Chrome user agent.
                  web.settings.userAgentString =
                      "Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36"
                  CookieManager.getInstance().setAcceptCookie(true)
                  CookieManager.getInstance().setAcceptThirdPartyCookies(web, true)
                  web.webViewClient = object : WebViewClient() {
                      override fun onPageFinished(view: WebView?, url: String?) {
                          if (url != null && url.contains("youtube.com")) check()
                      }
                  }
                  root.addView(web, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f))
                  setContentView(root)
                  web.loadUrl("https://accounts.google.com/ServiceLogin?service=youtube&continue=https%3A%2F%2Fwww.youtube.com%2F")
              }

              private fun check() {
                  if (done) return
                  val cm = CookieManager.getInstance()
                  val yt = cm.getCookie("https://www.youtube.com") ?: return
                  if (!yt.contains("SAPISID=") && !yt.contains("__Secure-3PSID=")) return
                  done = true
                  save(yt, (cm.getCookie("https://accounts.google.com") ?: "") + ";" + (cm.getCookie("https://www.google.com") ?: ""))
                  // Drop the WebView session so the saved cookies are not rotated/invalidated behind our back.
                  cm.removeAllCookies(null)
                  cm.flush()
                  Toast.makeText(this, "ورود به یوتیوب انجام شد ✅", Toast.LENGTH_SHORT).show()
                  finish()
              }

              // Saves the session as a Netscape cookies file that yt-dlp understands.
              private fun save(yt: String, google: String) {
                  CookieManager.getInstance().flush()
                  val exp = System.currentTimeMillis() / 1000 + 365L * 24L * 3600L
                  val sb = StringBuilder("# Netscape HTTP Cookie File\n")
                  fun add(domain: String, c: String) {
                      val seen = HashSet<String>()
                      for (part in c.split(";")) {
                          val p = part.trim()
                          val i = p.indexOf('=')
                          if (i <= 0) continue
                          val name = p.substring(0, i)
                          if (!seen.add(name)) continue
                          sb.append(domain).append("\tTRUE\t/\tTRUE\t").append(exp).append('\t')
                              .append(name).append('\t').append(p.substring(i + 1)).append('\n')
                      }
                  }
                  add(".youtube.com", yt)
                  add(".google.com", google)
                  File(filesDir, "yt_cookies.txt").writeText(sb.toString())
                  getSharedPreferences("prefs", MODE_PRIVATE).edit().putBoolean("ytLogin", true).apply()
              }

              override fun onDestroy() {
                  web.destroy()
                  super.onDestroy()
              }
          }
