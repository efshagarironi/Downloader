                      if (resultCode == RESULT_OK) {
                          Toast.makeText(this, "فایل‌ها از گوشی پاک شدند", Toast.LENGTH_SHORT).show()
                      }
                      pendingDelete = emptyList()
                      reload()
                  }
              }

