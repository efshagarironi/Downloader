              private fun loadAll(): List<Item> {
                  val res = ArrayList<Item>()
                  query(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, true, res)
                  query(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, false, res)
                  res.sortByDescending { it.added }
                  return res
              }

              private fun query(base: Uri, video: Boolean, out: MutableList<Item>) {
                  val proj = arrayOf(
                      MediaStore.MediaColumns._ID,
                      MediaStore.MediaColumns.DISPLAY_NAME,
                      MediaStore.MediaColumns.SIZE,
                      MediaStore.MediaColumns.DATE_ADDED,
                      "duration"
                  )
                  val sel: String
                  val args: Array<String>
                  if (Build.VERSION.SDK_INT >= 29) {
                      sel = MediaStore.MediaColumns.RELATIVE_PATH + " LIKE ? OR " + MediaStore.MediaColumns.RELATIVE_PATH + " LIKE ?"
                      args = arrayOf("%Downloader/%", "%ShareDL/%")
                  } else {
                      sel = MediaStore.MediaColumns.DATA + " LIKE ? OR " + MediaStore.MediaColumns.DATA + " LIKE ?"
                      args = arrayOf("%/Downloader/%", "%/ShareDL/%")
                  }
                  try {
                      contentResolver.query(base, proj, sel, args, null)?.use { c ->
                          val iId = c.getColumnIndexOrThrow(MediaStore.MediaColumns._ID)
                          val iName = c.getColumnIndexOrThrow(MediaStore.MediaColumns.DISPLAY_NAME)
                          val iSize = c.getColumnIndexOrThrow(MediaStore.MediaColumns.SIZE)
                          val iAdd = c.getColumnIndexOrThrow(MediaStore.MediaColumns.DATE_ADDED)
                          val iDur = c.getColumnIndexOrThrow("duration")
                          while (c.moveToNext()) {
                              val id = c.getLong(iId)
                              out.add(
                                  Item(
                                      (if (video) "v" else "a") + id,
                                      id,
                                      ContentUris.withAppendedId(base, id),
                                      c.getString(iName) ?: "?",
                                      video,
                                      c.getLong(iSize),
                                      c.getLong(iDur),
                                      c.getLong(iAdd)
                                  )
                              )
                          }
                      }
                  } catch (e: Throwable) {
                  }
              }

              private fun clean(name: String): String =
                  name.substringBeforeLast('.').replace(Regex("\\s*\\[(?=[^\\]]*\\d)[\\w-]{6,}\\]\\s*\$"), "")

              // ------------------------------------------------------------------
              private fun makeThumb(item: Item): Bitmap? {
                  if (Build.VERSION.SDK_INT >= 29) {
                      try {
                          return contentResolver.loadThumbnail(item.uri, Size(320, 240), null)
                      } catch (e: Throwable) {
                      }
                  } else {
                      try {
                          val b = MediaStore.Video.Thumbnails.getThumbnail(
                              contentResolver, item.id, MediaStore.Video.Thumbnails.MINI_KIND, null
                          )
                          if (b != null) return b
                      } catch (e: Throwable) {
                      }
                  }
                  val r = MediaMetadataRetriever()
                  return try {
                      r.setDataSource(this, item.uri)
                      r.getFrameAtTime(1000000)
                  } catch (e: Throwable) {
                      null
                  } finally {
                      try {
                          r.release()
                      } catch (e: Throwable) {
                      }
                  }
              }

              private fun buildRow(h: Holder): View {
                  val row = LinearLayout(this)
                  row.orientation = LinearLayout.HORIZONTAL
                  row.gravity = Gravity.CENTER_VERTICAL
                  row.setPadding(dp(8), dp(8), dp(12), dp(8))

                  val frame = FrameLayout(this)
                  frame.background = ColorDrawable(Ui.FIELD)
                  Ui.roundClip(frame, 12)
                  val icon = TextView(this)
                  icon.textSize = 26f
                  icon.gravity = Gravity.CENTER
                  val thumb = ImageView(this)
                  thumb.scaleType = ImageView.ScaleType.CENTER_CROP
                  frame.addView(icon, FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT))
                  frame.addView(thumb, FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT))
                  row.addView(frame, LinearLayout.LayoutParams(dp(104), dp(74)))

                  val col = LinearLayout(this)
                  col.orientation = LinearLayout.VERTICAL
                  col.setPaddingRelative(dp(12), 0, dp(8), 0)
                  val name = label("", 14f, Ui.TEXT, true)
                  name.maxLines = 2
                  name.ellipsize = android.text.TextUtils.TruncateAt.END
                  val meta = label("", 12f, Ui.MUTED)
                  col.addView(name)
                  val mp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                  mp.topMargin = dp(6)
                  col.addView(meta, mp)
                  row.addView(col, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))

                  val check = label("", 14f, Color.WHITE, true)
                  check.gravity = Gravity.CENTER
                  row.addView(check, LinearLayout.LayoutParams(dp(26), dp(26)))

                  h.row = row
                  h.icon = icon
                  h.thumb = thumb
                  h.name = name
                  h.meta = meta
                  h.check = check
                  return row
              }

              private fun bind(h: Holder, item: Item) {
                  val sel = item.key in selected
                  val selecting = selected.isNotEmpty()

                  h.row.background = if (sel) rect(Ui.GREEN_SEL, 16, Ui.GREEN, 2) else rect(Ui.CARD, 16, Ui.CARD_STROKE, 1)
                  h.icon.text = if (item.video) "🎬" else "🎵"
                  h.name.text = clean(item.name)

                  val parts = ArrayList<String>()
                  parts.add(Ui.size(item.size))
                  if (item.duration > 0) parts.add(Ui.dur(item.duration))
                  if (!item.video) parts.add(item.name.substringAfterLast('.', "").uppercase())
                  h.meta.text = parts.joinToString("  •  ")

                  h.check.visibility = if (selecting) View.VISIBLE else View.GONE
                  if (sel) {
                      h.check.background = Ui.oval(Ui.GREEN)
                      h.check.text = "✓"
                  } else {
                      h.check.background = Ui.oval(Color.TRANSPARENT, Ui.MUTED, dp(2))
                      h.check.text = ""
                  }

                  h.thumb.tag = item.key
                  val bm = cache.get(item.key)
                  if (bm != null) {
                      h.thumb.setImageBitmap(bm)
                  } else {
                      h.thumb.setImageBitmap(null)
                      if (item.video) {
                          pool.execute {
                              val b = makeThumb(item)
                              if (b != null) {
                                  cache.put(item.key, b)
                                  ui.post {
                                      if (h.thumb.tag == item.key) h.thumb.setImageBitmap(b)
                                  }
                              }
                          }
                      }
                  }
              }

              inner class Adapter : BaseAdapter() {
                  override fun getCount(): Int = items.size
                  override fun getItem(position: Int): Any = items[position]
                  override fun getItemId(position: Int): Long = items[position].id

                  override fun getView(position: Int, convertView: View?, parent: ViewGroup?): View {
                      val h: Holder
                      val v: View
                      if (convertView == null) {
                          h = Holder()
                          v = buildRow(h)
                          v.tag = h
                      } else {
                          v = convertView
                          h = convertView.tag as Holder
                      }
                      bind(h, items[position])
                      return v
                  }
              }
          }
