          import android.os.Looper
          import android.text.TextUtils
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.SeekBar
          import android.widget.TextView
          import android.widget.Toast
          import android.widget.VideoView

          class PlayerActivity : Activity() {

              private lateinit var vv: VideoView
              private lateinit var overlay: FrameLayout
              private lateinit var seek: SeekBar
              private lateinit var cur: TextView
              private lateinit var total: TextView
              private lateinit var playBtn: TextView

              private val ui = Handler(Looper.getMainLooper())
              private var dragging = false
              private var pos = 0

              private val hideRun = Runnable {
                  if (vv.isPlaying) overlay.visibility = View.GONE
              }

              private val tickRun = object : Runnable {
                  override fun run() {
                      val d = vv.duration
                      if (!dragging && d > 0) {
                          val p = vv.currentPosition
                          seek.max = d
                          seek.progress = p
                          cur.text = Ui.dur(p.toLong())
                          total.text = Ui.dur(d.toLong())
                      }
                      playBtn.text = if (vv.isPlaying) "❚❚" else "▶"
                      ui.postDelayed(this, 400)
                  }
              }

              private fun dp(x: Int) = Ui.dp(this, x)

              private fun shade(top: Boolean): GradientDrawable {
                  val dark = Color.argb(190, 0, 0, 0)
                  val clear = Color.argb(0, 0, 0, 0)
                  val colors = if (top) intArrayOf(dark, clear) else intArrayOf(clear, dark)
                  return GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM, colors)
              }

              private fun circle(s: String, fill: Int, sp: Float): TextView {
                  val t = TextView(this)
                  t.text = s
                  t.textSize = sp
                  t.setTextColor(Color.WHITE)
                  t.gravity = Gravity.CENTER
                  t.setTypeface(t.typeface, Typeface.BOLD)
                  t.background = Ui.oval(fill)
                  return t
              }

              private fun showOverlay() {
                  overlay.visibility = View.VISIBLE
                  ui.removeCallbacks(hideRun)
                  ui.postDelayed(hideRun, 3500)
              }

              private fun toggleOverlay() {
                  if (overlay.visibility == View.VISIBLE) {
                      ui.removeCallbacks(hideRun)
                      overlay.visibility = View.GONE
                  } else {
                      showOverlay()
                  }
              }

              private fun seekBy(delta: Int) {
                  val d = vv.duration
                  val max = if (d > 0) d else Int.MAX_VALUE
                  val t = (vv.currentPosition + delta).coerceIn(0, max)
                  vv.seekTo(t)
                  if (d > 0) {
                      seek.progress = t
                      cur.text = Ui.dur(t.toLong())
                  }
                  showOverlay()
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  if (savedInstanceState != null) pos = savedInstanceState.getInt("pos", 0)

                  val uri = Uri.parse(intent.getStringExtra("uri") ?: "")
                  val titleText = intent.getStringExtra("title") ?: ""

                  val root = FrameLayout(this)
                  root.setBackgroundColor(Color.BLACK)
                  root.layoutDirection = View.LAYOUT_DIRECTION_LTR

                  vv = VideoView(this)
                  root.addView(
                      vv,
                      FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          Gravity.CENTER
                      )
                  )
                  vv.setOnClickListener { toggleOverlay() }
                  root.setOnClickListener { toggleOverlay() }

                  overlay = FrameLayout(this)
                  root.addView(
                      overlay,
                      FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                      )
                  )

                  // ---- top bar ----
                  val top = LinearLayout(this)
                  top.orientation = LinearLayout.HORIZONTAL
                  top.gravity = Gravity.CENTER_VERTICAL
                  top.setPadding(dp(10), dp(12), dp(10), dp(28))
                  top.background = shade(true)
                  top.isClickable = true

                  val rot = circle("🔄", Color.argb(70, 255, 255, 255), 16f)
                  rot.setOnClickListener {
                      requestedOrientation =
                          if (resources.configuration.orientation == Configuration.ORIENTATION_LANDSCAPE)
                              ActivityInfo.SCREEN_ORIENTATION_PORTRAIT
                          else
                              ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE
                      showOverlay()
                  }
                  top.addView(rot, LinearLayout.LayoutParams(dp(44), dp(44)))

                  val titleView = TextView(this)
                  titleView.text = titleText
                  titleView.setTextColor(Color.WHITE)
                  titleView.textSize = 14f
                  titleView.maxLines = 1
                  titleView.ellipsize = TextUtils.TruncateAt.END
                  titleView.gravity = Gravity.CENTER
                  top.addView(titleView, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  top.addView(View(this), LinearLayout.LayoutParams(dp(44), dp(44)))

                  overlay.addView(
                      top,
                      FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          Gravity.TOP
                      )
                  )

                  // ---- bottom bar ----
                  val bottom = LinearLayout(this)
                  bottom.orientation = LinearLayout.VERTICAL
                  bottom.setPadding(dp(16), dp(28), dp(16), dp(16))
                  bottom.background = shade(false)
                  bottom.isClickable = true

                  val timeRow = LinearLayout(this)
                  timeRow.orientation = LinearLayout.HORIZONTAL
                  timeRow.gravity = Gravity.CENTER_VERTICAL

                  cur = TextView(this)
                  cur.text = "0:00"
                  cur.setTextColor(Color.WHITE)
                  cur.textSize = 12f
                  total = TextView(this)
                  total.text = "0:00"
                  total.setTextColor(Color.WHITE)
                  total.textSize = 12f

                  seek = SeekBar(this)
                  seek.progressTintList = ColorStateList.valueOf(Ui.GREEN)
                  seek.thumbTintList = ColorStateList.valueOf(Ui.GREEN)
                  seek.progressBackgroundTintList = ColorStateList.valueOf(Color.argb(120, 255, 255, 255))
                  seek.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
                          if (fromUser) cur.text = Ui.dur(p.toLong())
                      }

                      override fun onStartTrackingTouch(s: SeekBar?) {
                          dragging = true
                          ui.removeCallbacks(hideRun)
                      }

                      override fun onStopTrackingTouch(s: SeekBar?) {
                          vv.seekTo(s?.progress ?: 0)
                          dragging = false
                          showOverlay()
                      }
                  })

                  timeRow.addView(cur)
                  timeRow.addView(seek, LinearLayout.LayoutParams(0, dp(36), 1f))
                  timeRow.addView(total)
                  bottom.addView(timeRow)

                  val ctl = LinearLayout(this)
                  ctl.orientation = LinearLayout.HORIZONTAL
                  ctl.gravity = Gravity.CENTER

                  val back = circle("« 10", Color.argb(70, 255, 255, 255), 13f)
                  back.setOnClickListener { seekBy(-10000) }
                  playBtn = circle("▶", Ui.GREEN_DARK, 20f)
                  playBtn.setOnClickListener {
                      if (vv.isPlaying) vv.pause() else vv.start()
                      playBtn.text = if (vv.isPlaying) "❚❚" else "▶"
                      showOverlay()
                  }
                  val fwd = circle("10 »", Color.argb(70, 255, 255, 255), 13f)
                  fwd.setOnClickListener { seekBy(10000) }

                  val bp = LinearLayout.LayoutParams(dp(52), dp(52))
                  bp.marginStart = dp(18)
                  bp.marginEnd = dp(18)
                  val pp = LinearLayout.LayoutParams(dp(64), dp(64))
                  pp.marginStart = dp(18)
                  pp.marginEnd = dp(18)
                  ctl.addView(back, bp)
                  ctl.addView(playBtn, pp)
                  ctl.addView(fwd, bp)
                  bottom.addView(ctl)

                  overlay.addView(
                      bottom,
                      FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          Gravity.BOTTOM
                      )
                  )

                  setContentView(root)

                  vv.setOnPreparedListener { mp ->
                      mp.isLooping = false
                      if (pos > 0) vv.seekTo(pos)
                      vv.start()
                      showOverlay()
                  }
                  vv.setOnCompletionListener {
                      playBtn.text = "▶"
                      ui.removeCallbacks(hideRun)
                      overlay.visibility = View.VISIBLE
                  }
                  vv.setOnErrorListener { _, _, _ ->
                      Toast.makeText(this, "این فایل قابل پخش نیست", Toast.LENGTH_LONG).show()
                      true
                  }
                  vv.setVideoURI(uri)
              }

              override fun onResume() {
                  super.onResume()
                  ui.post(tickRun)
                  if (pos > 0) vv.seekTo(pos)
                  showOverlay()
              }

              override fun onPause() {
                  pos = vv.currentPosition
                  vv.pause()
                  ui.removeCallbacks(tickRun)
                  ui.removeCallbacks(hideRun)
                  super.onPause()
              }

              override fun onSaveInstanceState(outState: Bundle) {
                  super.onSaveInstanceState(outState)
                  outState.putInt("pos", vv.currentPosition)
              }

              override fun onDestroy() {
                  ui.removeCallbacksAndMessages(null)
                  vv.stopPlayback()
                  super.onDestroy()
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) {
                      window.decorView.systemUiVisibility = (View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                              or View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                              or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                              or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                              or View.SYSTEM_UI_FLAG_FULLSCREEN
                              or View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY)
                  }
              }
          }
          EOF

          cat > app/src/main/res/drawable/ic_launcher_bg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <gradient
                  android:angle="270"
                  android:startColor="#FFFFFF"
                  android:endColor="#DDF7E6" />
          </shape>
          EOF

          cat > app/src/main/res/drawable/ic_launcher_fg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#22C55E"
                  android:strokeColor="#22C55E"
                  android:strokeWidth="5"
                  android:strokeLineJoin="round"
                  android:pathData="M40,24 L68,24 L68,48 L81,48 L54,72 L27,48 L40,48 Z" />
              <path
                  android:strokeColor="#15803D"
                  android:strokeWidth="6"
                  android:strokeLineCap="round"
                  android:pathData="M30,81 L78,81" />
          </vector>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_bg" />
              <foreground android:drawable="@drawable/ic_launcher_fg" />
          </adaptive-icon>
          EOF

          cat > app/src/main/res/mipmap-anydpi/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item>
                  <shape android:shape="rectangle">
                      <gradient
                          android:angle="270"
                          android:startColor="#FFFFFF"
                          android:endColor="#DDF7E6" />
                      <corners android:radius="26dp" />
                  </shape>
              </item>
              <item android:drawable="@drawable/ic_launcher_fg" />
          </layer-list>
          EOF

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShareDL-apk
          path: app/build/outputs/apk/debug/*.apk
