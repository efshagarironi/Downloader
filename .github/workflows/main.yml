                  igBtn.text = if (on) "✅ وارد اینستاگرام شده‌ای — خروج" else "🔑 ورود به اینستاگرام (برای پست‌های محدود)"
                  igBtn.setTextColor(if (on) Ui.GREEN else Ui.MUTED)
              }

              private fun onInstaClick() {
                  val on = getSharedPreferences("prefs", MODE_PRIVATE).getBoolean("igLogin", false)
                  if (on) {
                      AlertDialog.Builder(this)
                          .setTitle("خروج از اینستاگرام؟")
